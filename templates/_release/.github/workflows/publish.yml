# The release this package ships with: a tag publishes, nothing else does.
#
#   1. bump "version" in package.json
#   2. commit it
#   3. git tag v0.1.1
#   4. git push --follow-tags
#
# This workflow then checks the tag against package.json, checks that the
# manifest names this GitHub repository (npm provenance needs that), runs the
# tests, and publishes that version to npm with provenance.
#
# The FIRST version of a brand-new package needs a token: trusted publishing
# only exists for packages that are already on npm. Either add a repository
# NPM_TOKEN secret and tag 0.1.0 like any other version, or publish 0.1.0 once
# by hand and configure the trusted publisher (this repository + publish.yml)
# in the package settings afterwards. From then on a tag is enough.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC: npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs an npm that speaks OIDC (11.5.1 and later).
      - name: Use the npm that can publish with provenance
        run: npm install -g npm@latest
      - name: The manifest names this repository
        run: |
          url="$(node -p "(() => { const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); return (p.repository && p.repository.url) || p.repository || '' })()")"
          url="${url#git+}"
          url="${url%.git}"
          want="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          want="${want%.git}"
          if [ "${url,,}" != "${want,,}" ]; then
            echo "package.json repository is ${url:-<missing>}; expected ${want}" >&2
            echo "set repository.url to this repository before publishing: npm provenance records where the package came from" >&2
            exit 1
          fi
      - name: The tag and the manifest agree
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            echo "bump the version, commit it, and tag that commit" >&2
            exit 1
          fi
          echo "publishing $version"
      # The templates declare no runtime dependencies. A package that adds some
      # installs them here, before the tests:
      # - name: Install
      #   run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      # Without a token, a package that is not on npm yet has no trusted publisher to
      # use, so the first version has to be published by hand (see the header).
      # With a token the package can be created right here, so the check is skipped.
      - name: A package that is not on npm yet needs a token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "an NPM_TOKEN secret can create the package; skipping the npm existence check"
            exit 0
          fi
          name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "$name is not on npm yet (or npm could not be reached), and trusted publishing only exists for packages that are." >&2
            echo "publish the first version from your machine with an npm token:" >&2
            echo "  npm config set //registry.npmjs.org/:_authToken \"\$NPM_TOKEN\"" >&2
            echo "  npm publish --access public" >&2
            echo "or add a repository NPM_TOKEN secret and tag the first version instead." >&2
            exit 1
          fi
      # Two ways to authenticate: trusted publishing (OIDC), when the package names
      # this repository and this workflow file in its trusted publishers, or a
      # repository NPM_TOKEN secret. The secret wins when it exists, so delete it
      # to go back to OIDC only.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "publishing with trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public
      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes